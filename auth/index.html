<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAPB- ELMN- Site de procedures d'urgence -</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/png" sizes="512x512" href="../icons/favicon.png?v=2">
  <link rel="shortcut icon" href="../icons/favicon.png?v=2">
  <link rel="apple-touch-icon" href="../icons/favicon.png?v=2">
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --text: #111827;
      --muted: #475569;
      --border: #dbe4ef;
      --blue: #1f7ae0;
      --ok: #1e9f4f;
      --danger: #c62828;
      --shadow: 0 18px 40px rgba(15, 23, 42, .12);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(31,122,224,.12), transparent 26%),
        linear-gradient(180deg, #f8fbff 0%, var(--bg) 100%);
      color: var(--text);
    }
    body {
      display: grid;
      place-items: center;
      padding: 24px 14px;
    }
    .shell {
      width: min(540px, 100%);
    }
    .logo-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 16px;
    }
    .site-logo {
      display: block;
      width: min(220px, 70vw);
      height: auto;
    }
    .panel {
      background: rgba(255,255,255,.92);
      border: 1px solid rgba(219,228,239,.95);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 26px 22px;
      text-align: center;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      padding: 7px 12px;
      border-radius: 999px;
      background: #eaf4ff;
      color: var(--blue);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    h1 {
      margin: 14px 0 0;
      font-size: clamp(28px, 5vw, 40px);
      line-height: 1.06;
    }
    .stack {
      display: grid;
      gap: 14px;
      margin-top: 22px;
    }
    .button-link, button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 14px 16px;
      border: 0;
      border-radius: 12px;
      background: #0f172a;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
    }
    button.secondary {
      width: auto;
      background: #fff;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .message {
      min-height: 24px;
      font-size: 14px;
      font-weight: 700;
      white-space: pre-line;
      margin-top: 14px;
    }
    .message.info { color: var(--blue); }
    .message.ok { color: var(--ok); }
    .message.error { color: var(--danger); }
    .hidden { display: none; }
    .session-box {
      margin-top: 22px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #f8fbff;
      text-align: center;
    }
    .button-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
      justify-content: center;
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="logo-wrap">
      <img class="site-logo" src="../icons/logo capb.png" alt="CAPB">
    </div>
    <section class="panel">
      <span class="eyebrow">Accès réservé</span>
      <h1>Connexion CAPB</h1>

      <div id="loginBox" class="stack">
        <a id="oauthBtn" class="button-link" href="#">Se connecter avec ELMN</a>
      </div>

      <div id="message" class="message" aria-live="polite"></div>

      <div id="sessionBox" class="session-box hidden">
        <p id="sessionText"></p>
        <div class="button-row">
          <button id="continueBtn" type="button">Continuer</button>
          <button id="logoutBtn" class="secondary" type="button">Se déconnecter</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const query = new URLSearchParams(window.location.search);
    const next = sanitizeNext(query.get('next'));
    const oauthError = query.get('error');
    const loginBox = document.getElementById('loginBox');
    const oauthBtn = document.getElementById('oauthBtn');
    const continueBtn = document.getElementById('continueBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const message = document.getElementById('message');
    const sessionBox = document.getElementById('sessionBox');
    const sessionText = document.getElementById('sessionText');

    oauthBtn.href = `../api/auth/oauth-start?next=${encodeURIComponent(next)}`;
    boot();

    continueBtn.addEventListener('click', () => {
      window.location.href = next;
    });

    logoutBtn.addEventListener('click', async () => {
      await fetch('../api/auth/logout', { method: 'POST' });
      sessionBox.classList.add('hidden');
      loginBox.classList.remove('hidden');
      setMessage('Session fermée.', 'ok');
    });

    async function boot() {
      if (oauthError) {
        setMessage(oauthError, 'error');
      }

      try {
        const response = await fetch('../api/auth/session', { cache: 'no-store' });
        const data = await response.json();
        if (data.authenticated) {
          loginBox.classList.add('hidden');
          sessionBox.classList.remove('hidden');
          sessionText.textContent = `Session active pour ${data.email}.`;
          setupInactivityLogout();
        }
      } catch {
      }
    }

    function setMessage(text, tone) {
      message.textContent = text;
      message.className = `message ${tone || ''}`;
    }

    function sanitizeNext(value) {
      if (!value || typeof value !== 'string' || !value.startsWith('/') || value.startsWith('//')) {
        return '/';
      }
      return value;
    }

    function setupInactivityLogout() {
      const inactivityMs = 60 * 60 * 1000;
      const touchIntervalMs = 5 * 60 * 1000;
      const events = ['click', 'keydown', 'pointerdown', 'scroll', 'touchstart'];
      let timeoutId = null;
      let lastTouchAt = 0;

      resetTimer();
      events.forEach(eventName => window.addEventListener(eventName, handleActivity, { passive: true }));
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          handleActivity();
        }
      });

      function handleActivity() {
        resetTimer();
        const now = Date.now();
        if (now - lastTouchAt < touchIntervalMs) {
          return;
        }
        lastTouchAt = now;
        fetch('../api/auth/touch', { method: 'POST', credentials: 'same-origin' }).catch(() => {});
      }

      function resetTimer() {
        clearTimeout(timeoutId);
        timeoutId = window.setTimeout(forceLogout, inactivityMs);
      }

      async function forceLogout() {
        try {
          await fetch('../api/auth/logout', { method: 'POST', credentials: 'same-origin' });
        } catch {
        }
        window.location.href = `../auth/?next=${encodeURIComponent(next)}`;
      }
    }
  </script>
</body>
</html>
