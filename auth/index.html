<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAPB- ELMN- Site de procedures d'urgence -</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/png" sizes="512x512" href="../icons/favicon.png?v=2">
  <link rel="shortcut icon" href="../icons/favicon.png?v=2">
  <link rel="apple-touch-icon" href="../icons/favicon.png?v=2">
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --text: #111827;
      --muted: #475569;
      --border: #dbe4ef;
      --blue: #1f7ae0;
      --blue-dark: #1559a6;
      --ok: #1e9f4f;
      --danger: #c62828;
      --shadow: 0 18px 40px rgba(15, 23, 42, .12);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(31,122,224,.12), transparent 26%),
        linear-gradient(180deg, #f8fbff 0%, var(--bg) 100%);
      color: var(--text);
    }
    body {
      display: grid;
      place-items: center;
      padding: 24px 14px;
    }
    .shell {
      width: min(540px, 100%);
    }
    .logo-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 16px;
    }
    .site-logo {
      display: block;
      width: min(220px, 70vw);
      height: auto;
    }
    .panel {
      background: rgba(255,255,255,.92);
      border: 1px solid rgba(219,228,239,.95);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 26px 22px;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      padding: 7px 12px;
      border-radius: 999px;
      background: #eaf4ff;
      color: var(--blue);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    h1 {
      margin: 14px 0 10px;
      font-size: clamp(28px, 5vw, 40px);
      line-height: 1.06;
    }
    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }
    .stack {
      display: grid;
      gap: 14px;
      margin-top: 22px;
    }
    label {
      display: grid;
      gap: 7px;
      font-weight: 700;
      color: var(--text);
    }
    .email-input-wrap {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: stretch;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
    }
    .email-input-wrap:focus-within {
      outline: 2px solid rgba(31,122,224,.20);
      border-color: var(--blue);
    }
    input {
      width: 100%;
      padding: 13px 14px;
      border: 0;
      font-size: 16px;
      color: var(--text);
      background: #fff;
    }
    input:focus {
      outline: 0;
    }
    .email-suffix {
      display: inline-flex;
      align-items: center;
      padding: 0 14px;
      background: #f8fbff;
      border-left: 1px solid var(--border);
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }
    .button-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 16px;
      border: 0;
      border-radius: 12px;
      background: var(--blue);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    button.secondary {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--border);
    }
    button:disabled {
      opacity: .65;
      cursor: wait;
    }
    .message {
      min-height: 24px;
      font-size: 14px;
      font-weight: 700;
      white-space: pre-line;
    }
    .message.info { color: var(--blue); }
    .message.ok { color: var(--ok); }
    .message.error { color: var(--danger); }
    .hidden { display: none; }
    .hint {
      font-size: 13px;
      color: var(--muted);
    }
    .session-box {
      margin-top: 22px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #f8fbff;
    }
    @media (max-width: 560px) {
      .email-input-wrap {
        grid-template-columns: 1fr;
      }
      .email-suffix {
        justify-content: flex-start;
        border-left: 0;
        border-top: 1px solid var(--border);
        padding: 10px 14px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="logo-wrap">
      <img class="site-logo" src="../icons/logo capb.png" alt="CAPB">
    </div>
    <section class="panel">
      <span class="eyebrow">Accès réservé</span>
      <h1>Demande de connexion</h1>
      <p>L’accès au site est réservé aux agents de la CAPB. Un code à usage unique est envoyé par email, validité 15 min.</p>

      <form id="emailForm" class="stack">
        <label>
          Adresse email professionnelle
          <div class="email-input-wrap">
            <input id="emailLocalPartInput" type="text" inputmode="email" autocomplete="username" placeholder="p.nom" autocapitalize="none" spellcheck="false" required>
            <span class="email-suffix">@communaute-paysbasque.fr</span>
          </div>
        </label>
        <div class="button-row">
          <button id="sendBtn" type="submit">Envoyer le code</button>
        </div>
      </form>

      <form id="codeForm" class="stack hidden">
        <label>
          Code à 6 chiffres
          <input id="codeInput" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="123456" required>
        </label>
        <p class="hint">Le code reste valable 15 minutes.</p>
        <div class="button-row">
          <button id="verifyBtn" type="submit">Valider le code</button>
          <button id="restartBtn" class="secondary" type="button">Changer d’email</button>
        </div>
      </form>

      <div id="message" class="message" aria-live="polite"></div>

      <div id="sessionBox" class="session-box hidden">
        <p id="sessionText"></p>
        <div class="button-row" style="margin-top: 12px;">
          <button id="continueBtn" type="button">Continuer</button>
          <button id="logoutBtn" class="secondary" type="button">Se déconnecter</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const EMAIL_DOMAIN = '@communaute-paysbasque.fr';
    const next = sanitizeNext(new URLSearchParams(window.location.search).get('next'));
    const emailForm = document.getElementById('emailForm');
    const codeForm = document.getElementById('codeForm');
    const emailLocalPartInput = document.getElementById('emailLocalPartInput');
    const codeInput = document.getElementById('codeInput');
    const sendBtn = document.getElementById('sendBtn');
    const verifyBtn = document.getElementById('verifyBtn');
    const restartBtn = document.getElementById('restartBtn');
    const continueBtn = document.getElementById('continueBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const message = document.getElementById('message');
    const sessionBox = document.getElementById('sessionBox');
    const sessionText = document.getElementById('sessionText');

    let currentEmail = '';

    boot();

    emailForm.addEventListener('submit', async event => {
      event.preventDefault();
      const localPart = sanitizeLocalPart(emailLocalPartInput.value);
      const email = buildEmail(localPart);

      if (!localPart) {
        setMessage('Saisir la partie avant @communaute-paysbasque.fr.', 'error');
        return;
      }

      setLoading(sendBtn, true);
      setMessage('Envoi du code en cours...', 'info');

      try {
        const response = await fetch('../api/auth/send-otp', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await response.json();

        if (!response.ok || !data.ok) {
          throw new Error(data.error || 'Envoi impossible.');
        }

        currentEmail = email;
        codeForm.classList.remove('hidden');
        emailForm.classList.add('hidden');
        codeInput.value = '';
        codeInput.focus();
        setMessage(data.message || `Code envoyé par email à ${email}. Vérifiez votre messagerie.`, 'ok');
      } catch (error) {
        setMessage(error.message || 'Envoi du code impossible.', 'error');
      } finally {
        setLoading(sendBtn, false);
      }
    });

    codeForm.addEventListener('submit', async event => {
      event.preventDefault();
      const code = codeInput.value.replace(/\D/g, '').slice(0, 6);

      if (code.length !== 6) {
        setMessage('Le code doit contenir 6 chiffres.', 'error');
        return;
      }

      setLoading(verifyBtn, true);
      setMessage('Vérification du code...', 'info');

      try {
        const response = await fetch('../api/auth/verify-otp', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ email: currentEmail, code, next })
        });
        const data = await response.json();

        if (!response.ok || !data.ok) {
          throw new Error(data.error || 'Code invalide.');
        }

        setMessage('Connexion réussie.', 'ok');
        window.location.href = data.redirectTo || next;
      } catch (error) {
        setMessage(error.message || 'Vérification impossible.', 'error');
      } finally {
        setLoading(verifyBtn, false);
      }
    });

    restartBtn.addEventListener('click', () => {
      currentEmail = '';
      emailForm.classList.remove('hidden');
      codeForm.classList.add('hidden');
      emailLocalPartInput.focus();
      setMessage('', 'info');
    });

    continueBtn.addEventListener('click', () => {
      window.location.href = next;
    });

    logoutBtn.addEventListener('click', async () => {
      await fetch('../api/auth/logout', { method: 'POST' });
      sessionBox.classList.add('hidden');
      emailForm.classList.remove('hidden');
      codeForm.classList.add('hidden');
      setMessage('Session fermée.', 'ok');
    });

    async function boot() {
      try {
        const response = await fetch('../api/auth/session', { cache: 'no-store' });
        const data = await response.json();
        if (data.authenticated) {
          emailForm.classList.add('hidden');
          codeForm.classList.add('hidden');
          sessionBox.classList.remove('hidden');
          sessionText.textContent = `Session active pour ${data.email}.`;
          setupInactivityLogout();
          return;
        }
      } catch {
      }

      emailLocalPartInput.focus();
    }

    function setLoading(button, active) {
      button.disabled = active;
    }

    function setMessage(text, tone) {
      message.textContent = text;
      message.className = `message ${tone || ''}`;
    }

    function sanitizeNext(value) {
      if (!value || typeof value !== 'string' || !value.startsWith('/') || value.startsWith('//')) {
        return '/';
      }
      return value;
    }

    function sanitizeLocalPart(value) {
      return String(value || '').trim().toLowerCase().replace(/@.*/, '');
    }

    function buildEmail(localPart) {
      return `${localPart}${EMAIL_DOMAIN}`;
    }

    function setupInactivityLogout() {
      const inactivityMs = 60 * 60 * 1000;
      const touchIntervalMs = 5 * 60 * 1000;
      const events = ['click', 'keydown', 'pointerdown', 'scroll', 'touchstart'];
      let timeoutId = null;
      let lastTouchAt = 0;

      resetTimer();
      events.forEach(eventName => window.addEventListener(eventName, handleActivity, { passive: true }));
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          handleActivity();
        }
      });

      function handleActivity() {
        resetTimer();
        const now = Date.now();
        if (now - lastTouchAt < touchIntervalMs) {
          return;
        }
        lastTouchAt = now;
        fetch('../api/auth/touch', { method: 'POST', credentials: 'same-origin' }).catch(() => {});
      }

      function resetTimer() {
        clearTimeout(timeoutId);
        timeoutId = window.setTimeout(forceLogout, inactivityMs);
      }

      async function forceLogout() {
        try {
          await fetch('../api/auth/logout', { method: 'POST', credentials: 'same-origin' });
        } catch {
        }
        window.location.href = `../auth/?next=${encodeURIComponent(next)}`;
      }
    }
  </script>
</body>
</html>
